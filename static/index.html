<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <title>研究分析 AI · 研究工作台</title>
  <link rel="stylesheet" href="/static/workspace.css">
  <script src="/static/vendor/marked-18.1.1.umd.js"></script>
  <script src="/static/vendor/purify-3.4.17.min.js"></script>
</head>
<body>
  <div class="workspace">
    <header class="topbar">
      <a class="brand" href="/" aria-label="研究分析 AI 首页">
        <span class="brand-mark" aria-hidden="true">研</span>
        <span>研究分析 <span class="brand-ai">AI</span></span>
      </a>
      <div id="connection" class="connection" role="status">正在检查服务状态…</div>
    </header>

    <main class="container">
      <section class="intro" aria-labelledby="workspace-title">
        <p class="eyebrow">研究工作台</p>
        <h1 id="workspace-title">把问题，变成清晰的判断。</h1>
        <p class="subtitle">从加密资产到你关心的主题，在这里梳理信息、展开分析。</p>
      </section>

      <section class="question-panel" aria-labelledby="question-label">
        <form id="ask-form">
          <label id="question-label" for="question">你想研究什么？</label>
          <div class="input-row">
            <input id="question" type="text" maxlength="2000" required
              placeholder="例如：分析 BTC 当前趋势，或人工智能对教育的影响">
            <button id="submit" type="submit">开始分析 <span aria-hidden="true">→</span></button>
            <button id="cancel" type="button" hidden>中断</button>
          </div>
          <p class="input-hint">描述具体问题，也可以继续追问本次会话。</p>
        </form>
      </section>

      <section class="report-panel" aria-labelledby="report-title">
        <header class="report-header">
          <div>
            <p class="eyebrow">分析与洞察</p>
            <h2 id="report-title">研究报告</h2>
          </div>
          <div class="report-meta">
            <span id="report-status" class="report-status" role="status">等待提问</span>
            <span id="elapsed-time" class="elapsed-time" hidden></span>
          </div>
        </header>
        <p id="report-question" class="report-question" hidden></p>

        <details id="progress" class="progress" hidden>
          <summary>
            <span>执行过程</span>
            <span id="progress-summary" class="progress-summary">查看详情</span>
          </summary>
          <div class="progress-body">
            <div id="progress-list" aria-live="polite"></div>
            <details class="request-details">
              <summary>会话与追踪信息</summary>
              <div id="request-ids"></div>
            </details>
          </div>
        </details>

        <div id="report" class="report placeholder" aria-live="polite" aria-busy="false">
          <div class="empty-state">
            <span class="empty-mark" aria-hidden="true">研</span>
            <h3>下一份洞察，从你的问题开始</h3>
            <p>在上方输入研究问题，分析结果将在这里逐步呈现。</p>
            <div class="empty-topics"><span>加密资产</span><span>行业趋势</span><span>专题研究</span></div>
          </div>
        </div>

        <details id="findings" class="findings" hidden>
          <summary id="findings-title">数据来源列表</summary>
          <div id="findings-list"></div>
        </details>
      </section>
      <footer class="workspace-footer">研究分析 AI <span>从问题出发，逐步形成判断</span></footer>
    </main>
  </div>

  <script>
    const form = document.getElementById("ask-form");
    const questionInput = document.getElementById("question");
    const submitButton = document.getElementById("submit");
    const cancelButton = document.getElementById("cancel");
    const connectionEl = document.getElementById("connection");
    const progressEl = document.getElementById("progress");
    const progressList = document.getElementById("progress-list");
    const requestIdsEl = document.getElementById("request-ids");
    const reportEl = document.getElementById("report");
    const findingsEl = document.getElementById("findings");
    const findingsTitleEl = document.getElementById("findings-title"); // 根据完成类型设置发现列表标题。
    const findingsList = document.getElementById("findings-list");
    const reportStatusEl = document.getElementById("report-status");
    const elapsedTimeEl = document.getElementById("elapsed-time");
    const reportQuestionEl = document.getElementById("report-question");
    const progressSummaryEl = document.getElementById("progress-summary");
    const savedThreadId = sessionStorage.getItem("crypto_analysis_thread_id");
    // 公网 HTTP 下使用可用的随机数接口，保持原有会话 ID 格式。
    const threadId = savedThreadId || "web-" + Array.from(
      crypto.getRandomValues(new Uint8Array(4)),
      byte => byte.toString(16).padStart(2, "0")
    ).join("");
    const agentLabels = {
      crypto_analysis_agent: "加密货币分析 Agent",
      topic_research_agent: "主题研究 Agent", // 普通主题进入独立研究图。
      rag_agent: "RAG Agent",
      realtime_agent: "实时数据 Agent"
    };
    let controller = null;
    sessionStorage.setItem("crypto_analysis_thread_id", threadId);

    async function checkHealth() {
      try {
        const response = await fetch("/health", { cache: "no-store" });
        if (!response.ok) throw new Error("服务状态不可用");
        connectionEl.textContent = "服务已连接";
        connectionEl.classList.add("connected");
      } catch (error) {
        connectionEl.textContent = "无法连接后端服务";
        connectionEl.classList.add("disconnected");
      }
    }

    function setReportStatus(text, kind = "") {
      reportStatusEl.textContent = text;
      reportStatusEl.className = "report-status" + (kind ? " " + kind : "");
    }

    function updateElapsedTime(state) {
      const elapsed = (state.endedAt ?? performance.now()) - state.startedAt;
      elapsedTimeEl.textContent = "耗时 " + (elapsed / 1000).toFixed(1) + " 秒";
    }

    function stopElapsedTime(state) {
      // 结束时间只记录一次，避免流关闭或页面渲染继续增加耗时。
      if (state.endedAt === null) state.endedAt = performance.now();
      if (state.timerId !== null) clearInterval(state.timerId);
      state.timerId = null;
      updateElapsedTime(state);
    }

    function renderMarkdown(element, content) {
      // Markdown 正文转为 HTML 后先清理，只开放报告排版需要的标签。
      const fragment = DOMPurify.sanitize(marked.parse(content, { gfm: true }), {
        ALLOWED_TAGS: [
          "p", "br", "h1", "h2", "h3", "h4", "h5", "h6", "strong", "em",
          "del", "ul", "ol", "li", "blockquote", "hr", "pre", "code", "a",
          "table", "thead", "tbody", "tr", "th", "td"
        ],
        ALLOWED_ATTR: ["href", "title", "start", "colspan", "rowspan", "align"],
        ALLOW_DATA_ATTR: false,
        ALLOW_ARIA_ATTR: false,
        RETURN_DOM_FRAGMENT: true
      });
      for (const link of fragment.querySelectorAll("a")) {
        link.target = "_blank";
        link.rel = "noopener noreferrer";
      }
      for (const table of fragment.querySelectorAll("table")) {
        const wrapper = document.createElement("div");
        wrapper.className = "table-scroll";
        wrapper.tabIndex = 0;
        wrapper.setAttribute("role", "region");
        wrapper.setAttribute("aria-label", "可横向滚动的数据表格");
        table.replaceWith(wrapper);
        wrapper.appendChild(table);
      }
      element.replaceChildren(fragment);
    }

    function clearReport(state) {
      // 清理待渲染帧，避免重试或失败后旧正文重新出现在页面。
      if (state.renderFrame !== null) cancelAnimationFrame(state.renderFrame);
      state.renderFrame = null;
      state.report = "";
      reportEl.textContent = "";
    }

    function flushReport(state) {
      if (state.renderFrame !== null) cancelAnimationFrame(state.renderFrame);
      state.renderFrame = null;
      renderMarkdown(reportEl, state.report);
    }

    function appendReport(content, state) {
      // 原始 Markdown 放在本次请求状态中，同一帧的流式片段合并渲染。
      state.report += content;
      if (state.renderFrame !== null) return;
      state.renderFrame = requestAnimationFrame(() => {
        state.renderFrame = null;
        renderMarkdown(reportEl, state.report);
      });
    }

    function addProgress(label, status, kind = "") {
      const item = document.createElement("div");
      item.className = "progress-item" + (kind ? " " + kind : "");
      const node = document.createElement("span");
      node.className = "node";
      node.textContent = "[" + label + "]";
      const detail = document.createElement("span");
      detail.className = "status";
      detail.textContent = status;
      item.append(node, detail);
      progressList.appendChild(item);
      progressSummaryEl.textContent = progressList.childElementCount + " 条执行记录";
    }

    function renderFindings(findings) {
      findingsList.textContent = "";
      findingsEl.hidden = !Array.isArray(findings) || findings.length === 0;
      if (findingsEl.hidden) return;
      for (const finding of findings) {
        const item = document.createElement("div");
        item.className = "finding";
        if (typeof finding === "string") {
          renderMarkdown(item, finding);
        } else {
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(finding, null, 2);
          item.appendChild(pre);
        }
        findingsList.appendChild(item);
      }
    }

    function handleEvent(name, data, state) {
      if (name === "progress") {
        const label = data.label || data.node || "进度";
        const status = data.status || data.detail || "处理中";
        const kind = status.includes("不合格") || status.includes("rework")
          ? "rework" : status.includes("合格") || status.includes("pass") ? "pass" : "";
        addProgress(label, status, kind);
        if (data.node === "writer") state.writerComplete = true;
      } else if (name === "route") {
        state.agents.push(data.agent);
        addProgress("分派", "已交给 " + (agentLabels[data.agent] || data.agent));
      } else if (name === "report_start") {
        // 每次报告生成尝试都重新展示，避免重试正文与上一次残留拼接。
        clearReport(state);
        reportEl.classList.remove("placeholder", "error");
        reportEl.classList.add("blink");
        state.outputNode = "writer";
        state.writerComplete = false;
      } else if (name === "token") {
        if (typeof data.content !== "string" || !data.content) return;
        if (data.source_node === "model") return;
        if (data.node === "writer") {
          if (state.outputNode !== "writer" || state.writerComplete) {
            clearReport(state);
            state.outputNode = "writer";
            state.writerComplete = false;
          }
        } else if (data.node === "finalize") {
          if (state.outputNode === "writer" || state.writerComplete) return;
          state.outputNode = "finalize";
        } else {
          return;
        }
        reportEl.classList.remove("placeholder");
        appendReport(data.content, state);
      } else if (name === "done") {
        stopElapsedTime(state);
        state.finished = true;
        findingsTitleEl.textContent = data.kind === "topic_research" ? "主题研究明细" : "数据来源列表";
        reportEl.classList.remove("blink");
        setReportStatus(data.kind === "direct" ? "已回复" : "分析完成", "complete");
        if (typeof data.report === "string" && data.report) {
          reportEl.classList.remove("placeholder");
          state.report = data.report;
        }
        // 完成事件里的最终正文仍然是权威结果，覆盖流式期间的内容。
        flushReport(state);
        // 技能内容只展示指标表格，不反解析数值。
        const records = Array.isArray(data.skill_results)
          ? data.skill_results.filter(skill => skill.content).map(skill =>
              `## ${skill.name}${skill.cache_hit ? "（读取记忆）" : ""}\n\n${skill.content}`)
          : [];
        renderFindings(data.kind === "topic_research" ? data.findings : records);
        if (data.target_asset) addProgress("标的", data.target_asset + " · 维度分析"); // 展示统一目标币种。
        if (data.as_of) {
          // 内部保留 UTC，页面统一按北京时间展示到秒。
          const displayTime = new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Asia/Shanghai",
            year: "numeric", month: "2-digit", day: "2-digit",
            hour: "2-digit", minute: "2-digit", second: "2-digit",
            hourCycle: "h23"
          }).format(new Date(data.as_of));
          addProgress("分析时间", displayTime + "（北京时间）");
        }
        if (data.kind === "topic_research") addProgress("资料范围", data.verification); // 标明主题研究未联网核验。
        if (data.kind === "direct") addProgress("直接回复", "问题研究已完成"); // 闲聊或超出研究范围。
        addProgress("完成", data.kind === "direct" ? "已回复" : "分析已结束", "pass");
      } else if (name === "error") {
        stopElapsedTime(state);
        state.finished = true;
        clearReport(state);
        setReportStatus("分析失败", "failed");
        reportEl.classList.remove("blink", "placeholder");
        reportEl.classList.add("error");
        reportEl.textContent = data.message || "请求失败";
        addProgress("失败", "请使用追踪 ID 查看后端日志", "failed");
      }
    }

    function parseBlock(block, state) {
      let name = "";
      const dataLines = [];
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) name = line.slice(6).trim();
        if (line.startsWith("data:")) dataLines.push(line.slice(5).trimStart());
      }
      if (name && dataLines.length > 0) {
        handleEvent(name, JSON.parse(dataLines.join("\n")), state);
      }
    }

    async function readEvents(body, state) {
      const reader = body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        buffer = buffer.replaceAll("\r", "");
        const blocks = buffer.split("\n\n");
        buffer = blocks.pop();
        for (const block of blocks) parseBlock(block, state);
        if (done) {
          if (buffer.trim()) parseBlock(buffer, state);
          break;
        }
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = questionInput.value.trim();
      if (!question || controller) return;

      controller = new AbortController();
      submitButton.disabled = true;
      cancelButton.hidden = false;
      progressEl.hidden = false;
      progressList.textContent = "";
      requestIdsEl.textContent = "会话 ID：" + threadId;
      reportEl.className = "report blink";
      reportEl.textContent = "";
      findingsEl.hidden = true;
      findingsList.textContent = "";
      findingsEl.open = false;
      progressEl.open = false;
      reportQuestionEl.textContent = question;
      reportQuestionEl.hidden = false;
      reportEl.setAttribute("aria-busy", "true");
      setReportStatus("正在分析", "running");
      addProgress("提交", "请求已发送");
      const state = {
        agents: [], finished: false, outputNode: null, writerComplete: false,
        report: "", renderFrame: null,
        startedAt: performance.now(), endedAt: null, timerId: null
      };
      elapsedTimeEl.hidden = false;
      updateElapsedTime(state);
      state.timerId = setInterval(() => updateElapsedTime(state), 100);

      try {
        const response = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "text/event-stream",
            "X-Thread-Id": threadId
          },
          body: JSON.stringify({ question }),
          signal: controller.signal
        });
        const traceId = response.headers.get("X-Trace-Id");
        const responseThreadId = response.headers.get("X-Thread-Id") || threadId;
        requestIdsEl.textContent = "会话 ID：" + responseThreadId
          + (traceId ? " · 追踪 ID：" + traceId : "");
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.detail || "HTTP " + response.status);
        }
        if (!response.body) throw new Error("浏览器未提供响应流");
        await readEvents(response.body, state);
        if (!state.finished) throw new Error("事件流提前结束");
      } catch (error) {
        stopElapsedTime(state);
        if (error.name === "AbortError") {
          flushReport(state);
          setReportStatus("已中断");
          addProgress("中断", "已停止接收本次回答");
        } else {
          clearReport(state);
          setReportStatus("分析失败", "failed");
          reportEl.classList.remove("placeholder");
          reportEl.classList.add("error");
          reportEl.textContent = error.message;
          addProgress("失败", "请求未完成", "failed");
        }
      } finally {
        stopElapsedTime(state);
        if (state.renderFrame !== null) flushReport(state);
        reportEl.setAttribute("aria-busy", "false");
        reportEl.classList.remove("blink");
        submitButton.disabled = false;
        cancelButton.hidden = true;
        controller = null;
      }
    });

    cancelButton.addEventListener("click", () => {
      if (controller) controller.abort();
    });

    checkHealth();
  </script>
</body>
</html>
